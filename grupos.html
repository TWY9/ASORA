    <style>
        /* === Groups 2D Navigation === */
        .groups-navigation {
            position: relative;
        }

        /* Subject indicator */
        .subject-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: var(--space-xl);
        }

        .subject-indicator-text {
            font-size: var(--font-sm);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subject-dots {
            display: flex;
            gap: 6px;
        }

        .subject-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.3;
            transition: all var(--transition-base);
            cursor: pointer;
        }

        .subject-dot.active {
            background: var(--accent-primary);
            opacity: 1;
            box-shadow: 0 0 10px rgba(0, 212, 170, 0.4);
        }

        /* Topic Navigation (horizontal) */
        .topic-nav {
            display: flex;
            align-items: center;
            gap: var(--space-lg);
            margin-bottom: var(--space-lg);
        }

        .topic-nav-track {
            flex: 1;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            overflow-x: auto;
            padding: var(--space-sm) 0;
            scrollbar-width: none;
        }

        .topic-nav-track::-webkit-scrollbar {
            display: none;
        }

        .topic-tab {
            padding: var(--space-sm) var(--space-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-secondary);
            font-size: var(--font-sm);
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--transition-base);
            flex-shrink: 0;
        }

        .topic-tab:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .topic-tab.active {
            background: var(--accent-gradient);
            color: var(--bg-primary);
            border-color: transparent;
            font-weight: 600;
            box-shadow: var(--shadow-glow);
        }

        .topic-arrow {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: var(--font-base);
            cursor: pointer;
            transition: all var(--transition-base);
            flex-shrink: 0;
        }

        .topic-arrow:hover {
            background: var(--accent-glow);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Down arrow to switch subjects */
        .subject-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: var(--space-xl);
        }

        .subject-arrow-down {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: var(--space-md) var(--space-xl);
            border-radius: var(--border-radius);
            transition: all var(--transition-base);
            color: var(--text-muted);
        }

        .subject-arrow-down:hover {
            color: var(--accent-primary);
            background: var(--accent-glow);
        }

        .subject-arrow-down .arrow-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            font-size: var(--font-lg);
            transition: all var(--transition-base);
        }

        .subject-arrow-down:hover .arrow-icon {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-glow);
            transform: translateY(3px);
        }

        .subject-arrow-down .arrow-label {
            font-size: var(--font-xs);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .next-subject-preview {
            font-size: var(--font-xs);
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* Group content transition */
        .group-content-area {
            position: relative;
            min-height: 300px;
        }

        .group-slide {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .group-slide.slide-out-left {
            opacity: 0;
            transform: translateX(-40px);
        }

        .group-slide.slide-out-right {
            opacity: 0;
            transform: translateX(40px);
        }

        .group-slide.slide-out-up {
            opacity: 0;
            transform: translateY(-40px);
        }

        .group-slide.slide-in {
            opacity: 0;
            transform: translateY(20px);
        }

        /* Topic counter */
        .topic-counter {
            text-align: center;
            font-size: var(--font-xs);
            color: var(--text-muted);
            margin-top: var(--space-sm);
        }
    </style>
</head>

            const dotsContainer = document.getElementById('subjectDots');
            dotsContainer.innerHTML = subjectsData.map((s, i) =>
                `<div class="subject-dot ${i === currentSubjectIndex ? 'active' : ''}" 
              onclick="goToSubject(${i})" title="${s.name}"></div>`
            ).join('');
        }

        function renderTopicTabs() {
            const tabsContainer = document.getElementById('topicTabs');
            const subject = subjectsData[currentSubjectIndex];
            tabsContainer.innerHTML = subject.topics.map((t, i) =>
                `<div class="topic-tab ${i === currentTopicIndex ? 'active' : ''}" 
              onclick="goToTopic(${i})">${t.name}</div>`
            ).join('');
        }

        function renderGroupCard() {
            const container = document.getElementById('groupContent');
            const subject = subjectsData[currentSubjectIndex];
            const topic = subject.topics[currentTopicIndex];

            const badgeClass = subject.badge === 'presencial' ? 'badge-presencial' : 'badge-online';
            const badgeIcon = subject.badge === 'presencial' ? '📍' : '🌐';
            const badgeText = subject.badge === 'presencial' ? 'Presencial' : 'Online';

            let scheduleRows = '';
            timeSlots.forEach((time, rowIdx) => {
                let cells = `<td class="time-col">${time}</td>`;
                days.forEach((_, colIdx) => {
                    const val = topic.schedule[rowIdx][colIdx];
                    if (val === 'Ocupado') {
                        cells += `<td class="occupied" onclick="showGroupModal(${currentSubjectIndex}, ${currentTopicIndex})">Ocupado</td>`;
                    } else {
                        cells += `<td></td>`;
                    }
                });
                scheduleRows += `<tr>${cells}</tr>`;
            });

            container.innerHTML = `
        <div class="group-card">
          <div class="group-card-header">
            <div>
              <h2 class="group-title">${subject.name}</h2>
              <div class="group-advisor">
                <div class="group-advisor-avatar">👤</div>
                <span>${subject.advisor}</span>
              </div>
              <div class="group-topics">Tema: ${topic.name}</div>

              </thead>

              </tbody>
            </table>
          </div>
        </div>
        <div class="topic-counter">
          Tema ${currentTopicIndex + 1} de ${subject.topics.length} · ${subject.name}
        </div>
      `;

        function updateNextSubjectPreview() {
            const preview = document.getElementById('nextSubjectPreview');
            const nextIdx = (currentSubjectIndex + 1) % subjectsData.length;
            preview.textContent = subjectsData[nextIdx].name;
        }

        function renderAll() {
            renderSubjectDots();
            renderTopicTabs();
            renderGroupCard();
            updateNextSubjectPreview();
        }

        // Navigate topics (horizontal ◀ ▶)
        function navigateTopic(direction) {
            const subject = subjectsData[currentSubjectIndex];
            const newIndex = currentTopicIndex + direction;
            if (newIndex < 0 || newIndex >= subject.topics.length) return;

            const container = document.getElementById('groupContent');
            container.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');

            setTimeout(() => {
                currentTopicIndex = newIndex;
                renderAll();
                container.classList.remove('slide-out-left', 'slide-out-right');
                container.classList.add('slide-in');
                requestAnimationFrame(() => {
                    container.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    container.style.opacity = '1';
                    container.style.transform = 'translateY(0)';
                    setTimeout(() => {
                        container.classList.remove('slide-in');
                        container.style.transition = '';
                        container.style.opacity = '';
                        container.style.transform = '';
                    }, 400);
                });
            }, 300);
        }

        function goToTopic(index) {
            if (index === currentTopicIndex) return;
            const direction = index > currentTopicIndex ? 1 : -1;
            const container = document.getElementById('groupContent');
            container.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');

            setTimeout(() => {
                currentTopicIndex = index;
                renderAll();
                container.classList.remove('slide-out-left', 'slide-out-right');
                container.classList.add('slide-in');
                requestAnimationFrame(() => {
                    container.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    container.style.opacity = '1';
                    container.style.transform = 'translateY(0)';
                    setTimeout(() => {
                        container.classList.remove('slide-in');
                        container.style.transition = '';
                        container.style.opacity = '';
                        container.style.transform = '';
                    }, 400);
                });
            }, 300);
        }

        // Navigate subjects (vertical ▼)
        function navigateSubject(direction) {
            const newIndex = currentSubjectIndex + direction;
            if (newIndex < 0 || newIndex >= subjectsData.length) {
                // Wrap around
                if (newIndex < 0) {
                    currentSubjectIndex = subjectsData.length - 1;
                } else {
                    currentSubjectIndex = 0;
                }
            } else {
                currentSubjectIndex = newIndex;
            }
            currentTopicIndex = 0;

            const container = document.getElementById('groupContent');
            container.classList.add('slide-out-up');

            setTimeout(() => {
                renderAll();
                container.classList.remove('slide-out-up');
                container.classList.add('slide-in');
                requestAnimationFrame(() => {
                    container.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    container.style.opacity = '1';
                    container.style.transform = 'translateY(0)';
                    setTimeout(() => {
                        container.classList.remove('slide-in');
                        container.style.transition = '';
                        container.style.opacity = '';
                        container.style.transform = '';
                    }, 400);
                });
            }, 300);
        }

        function goToSubject(index) {
            if (index === currentSubjectIndex) return;
            currentSubjectIndex = index;
            currentTopicIndex = 0;

            const container = document.getElementById('groupContent');
            container.classList.add('slide-out-up');

            setTimeout(() => {
                renderAll();
                container.classList.remove('slide-out-up');
                container.classList.add('slide-in');
                requestAnimationFrame(() => {
                    container.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    container.style.opacity = '1';
                    container.style.transform = 'translateY(0)';
                    setTimeout(() => {
                        container.classList.remove('slide-in');
                        container.style.transition = '';
                        container.style.opacity = '';
                        container.style.transform = '';
                    }, 400);
                });
            }, 300);
        }

        // Modal for group info
        function showGroupModal(subjectIdx, topicIdx) {
            const subject = subjectsData[subjectIdx];
            const topic = subject.topics[topicIdx];
            const info = topic.modalInfo;

            const modal = document.getElementById('infoModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = 'Información de Asesoría';

            body.innerHTML = `
        <div class="modal-info-item">
          <div class="modal-info-icon">📚</div>
          <div>
            <div class="modal-info-label">Asesoría</div>
            <div class="modal-info-value">${subject.name}</div>
          </div>
        </div>
        <div class="modal-info-item">
          <div class="modal-info-icon">📝</div>
          <div>
            <div class="modal-info-label">Temas</div>
            <div class="modal-info-value">${info.tema}</div>
          </div>
        </div>
        <div class="modal-info-item">
          <div class="modal-info-icon">📅</div>
          <div>
            <div class="modal-info-label">Fecha</div>
            <div class="modal-info-value">${info.fecha}</div>
          </div>
        </div>
        <div class="modal-info-item">
          <div class="modal-info-icon">${subject.badge === 'presencial' ? '📍' : '🌐'}</div>
          <div>
            <div class="modal-info-label">${subject.badge === 'presencial' ? 'Lugar' : 'Modalidad'}</div>
            <div class="modal-info-value">${info.lugar}</div>
          </div>
        </div>
        <div class="modal-info-item">
          <div class="modal-info-icon">🕐</div>
          <div>
            <div class="modal-info-label">Hora</div>
            <div class="modal-info-value">${info.hora}</div>
          </div>
        </div>
      `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('infoModal').classList.contains('active')) {
                if (e.key === 'Escape') closeInfoModal();
                return;
            }
            if (e.key === 'ArrowLeft') navigateTopic(-1);
            if (e.key === 'ArrowRight') navigateTopic(1);
            if (e.key === 'ArrowDown') { e.preventDefault(); navigateSubject(1); }
            if (e.key === 'ArrowUp') { e.preventDefault(); navigateSubject(-1); }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
        });
    </script>
</body>

</html>
